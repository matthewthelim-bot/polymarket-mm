[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "polymarket-mm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0", "pyyaml>=6.0.1", "scipy>=1.12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
