strategy:
  min_edge_floor: 0.005          # minimum net edge required to quote
  half_spread_base: 0.015        # base half-spread before fee adjustment
  max_inventory_contracts: 500   # hard inventory limit per market
  adverse_selection_window: 15   # minutes for AS estimator rolling window
  adverse_selection_threshold: 0.012  # suspend if AS > this
  capital_charge_rate: 0.0003    # daily capital charge per contract (hedgeable)
  skew_capital_charge_multiplier: 3.0

skew:
  skew_tolerance: 0.0            # 0 = no skew allowed by default
  skew_edge_premium: 0.005       # extra edge required to accept skew
  skew_hard_limit: 100           # max unhedgeable contracts
  max_skew_notional: 500.0       # USDC notional limit on skew bucket

fee:
  rebate_fraction: 0.20          # maker rebate as fraction of taker fee equiv

backtest:
  queue_model: FRONT             # FRONT | PRO_RATA | BACK
  fill_model: TOUCH              # TOUCH | VOLUME | IMPACT
  latency_ms: 50                 # simulated order latency
  start_capital: 50000.0
